url: https://raiservi.github.io/rminka/
template:
  package: tidytemplate
  bootstrap: 5
  figures:
    logo: vignettes/figures/logo1.png
  includes:
    in_header: |
      <script defer data-domain="dplyr.tidyverse.org,all.tidyverse.org" src="https://plausible.io/js/plausible.js"></script>
      <script async src="https://widget.kapa.ai/kapa-widget.bundle.js"
      data-button-hide="true"
      data-modal-disclaimer="This is a custom LLM for answering questions about dplyr, tidyr, and ggplot2. Answers are based on the contents of the documentation. Rate the answers to let us know what you think!"
      data-modal-ask-ai-input-placeholder="Ask me a question about dplyr, tidyr, or ggplot2."
      data-modal-header-bg-color="#f9f9f9"
      data-modal-override-open-class="open-kapa-widget"
      data-project-color="#365a7a"
      data-project-name="dplyr"
      data-modal-title="tidyverse AI ✨"
      data-user-analytics-fingerprint-enabled="true"
      data-bot-protection-mechanism="hcaptcha"
      data-website-id="44ae76c6-2ae5-4899-ab42-de9f17f07c7b"
      ></script>

navbar:
  left:
    - text: "Get Started"
      href: articles/getting-started.html
    - text: "Reference"
      href: reference/index.html
    - text: "News"
      menu:
        - text: "Releases"
          href: https://github.com/raiservi/rminka/releases
        - text: "Changelog"
          href: news/index.html
    - text: "Articles"
      href: articles/index.html
  right:
    - icon: fa-github fa-lg
      href: https://github.com/raiservi/rminka/

reference:
- title: Project Queries
  desc: >
    Set of complementary functions to find projects and their associated.
    observations
  contents:
  - mnk_proj_byname
  - mnk_proj_info
  - mnk_proj_obs
- title: User Queries
  desc: >
    Functions to find users and their contributed observations.
  contents:
  - mnk_user_byname
  - mnk_user_proj
- title: Place Querie
  desc: >
    Functions to find places and retrieve their spatial data.
  contents:
  - mnk_places_byname
  - mnk_place_sf
- title: Observation Queries
  desc: >
    A variety of functions to fetch observation data based on different
    parameters.
  contents:
  - mnk_obs_id
- title: Auxiliary functions
  desc: >
    A set of functions with different utilities that complement Minka's
    observational data and help in processing them when used in other
    R packages (`vegan`, `dismo`, `labdsv` or others).
  contents:
  - get_wrm_tax
  - shrt_name
