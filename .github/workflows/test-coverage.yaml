    # .codecov.yml
    # Configuración básica para un proyecto de R con Codecov

    # Indica el tipo de reporte que estás subiendo.
    # Si estás subiendo 'cobertura.xml', Codecov lo detectará.
    # Este 'defaults' es más bien para el tipo de procesado del lado de Codecov.
    codecov:
      notify:
        require_ci_to_pass: yes # Solo notificar si la CI ha pasado

    # Definir la rama de base.
    # Esto es crucial para que Codecov compare la cobertura de PRs con la principal.
    # Ajusta 'main' o 'master' según cuál sea tu rama principal.
    coverage:
      status:
        project:
          default:
            target: auto
            threshold: 1% # Tolerancia para que la cobertura no baje demasiado en PRs
        patch:
          default:
            target: auto
            threshold: 1% # Asegurar que los cambios en PR no reduzcan la cobertura

    # Opciones de ignorado (ajusta según tus necesidades)
    # paths:
    #   ignore:
    #     - "R/funciones_internas.R" # Ejemplo: ignorar ciertos archivos
    #     - "inst/"
    #     - "man/"
    #     - "vignettes/"
    #     - "data/"
    #     - "tests/" # Si no quieres reportar la cobertura de los propios tests
    #     - ".github/"

    comment: # Configuración de los comentarios en Pull Requests
      layout: "diff, files"
      behavior: default
      require_changes: no # Si no hay cambios en la cobertura, no comentar
