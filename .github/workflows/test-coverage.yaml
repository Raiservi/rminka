name: R-CMD-check

on:
  push:
    branches: [ main, master ] # Asegúrate de que coincida con tu rama principal
  pull_request:
    branches: [ main, master ] # Asegúrate de que coincida con tu rama principal

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }} # Útil para instalar dependencias de GitHub

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ¡Crucial para que la cobertura se calcule correctamente!

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.x' # O la versión de R que uses, por ejemplo 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: covr # Asegúrate de que covr esté instalado para el cálculo de cobertura
          needs: "check" # Instala las dependencias necesarias para el check

      - name: Run R CMD check
        run: |
          R CMD check . || true # Ejecuta el check. El '|| true' permite que el workflow continúe si hay warnings.

      # --- NUEVO PASO PARA LA COBERTURA CON CODECOV ---
      - name: Calculate coverage with covr and upload to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Solo en pushes a la rama principal
        run: |
          Rscript -e 'covr::codecov(type = "all")' # Calcula y sube la cobertura
        env:
          # Si tu repo es público, este token puede ser opcional.
          # Si es privado, DEBE estar configurado en los secrets de GitHub.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
