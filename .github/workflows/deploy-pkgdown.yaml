## Archivo: .github/workflows/deploy-pkgdown.yaml

on:
  push:
    branches:
      - master # o main, si esa es tu rama principal

name: Deploy pkgdown site

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # Este paso instala pkgdown, las dependencias de tu archivo DESCRIPTION
      # y cualquier otra dependencia del sistema que necesiten. Es todo en uno.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::pkgdown

      # Este comando es más moderno y robusto para GitHub Pages.
      # Automáticamente lee tu _pkgdown.yml y construye el sitio.
      - name: Build pkgdown site
        run: R -e 'pkgdown::build_site_github_pages()'

      # El resto del archivo es para el despliegue y está correcto.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
