# Archivo: .github/workflows/deploy-pkgdown.yaml

on:
  push:
    branches:
      - master

name: Deploy pkgdown site

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            pkgdown
             sf
          extra-packages: |
            remotes

      - name: Install dependencies from DESCRIPTION
        run: |
          R -e 'install.packages("remotes")'
          R -e 'remotes::install_deps(dependencies = TRUE)'

      - name: Build pkgdown site
        run: |
          R -e 'pkgdown::build_site()'

      - name: List files in workspace for debugging
        run: |
          echo "Listing contents of /github/workspace:"
          ls -R /github/workspace
          echo "Listing contents of /github/workspace/docs:"
          ls -R /github/workspace/docs || echo "docs directory not found or empty."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
