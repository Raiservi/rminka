# Archivo: .github/workflows/deploy-pkgdown.yaml

on:
  push:
    branches:
      - master  # o main, dependiendo de tu rama principal

name: Deploy pkgdown site

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release' # Puedes especificar una versión como '4.3.0'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            pkgdown
            # Aquí añade cualquier otra dependencia de tu paquete que pkgdown necesite
            # Por ejemplo, si tu paquete usa data.table, ponlo aquí
          extra-packages: |
            remotes

      - name: Install dependencies from DESCRIPTION
        run: |
          R -e 'install.packages("remotes")'
          R -e 'remotes::install_deps(dependencies = TRUE)'

      - name: Build pkgdown site
        run: |
          R -e 'pkgdown::build_site()'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: List files in workspace
        run: ls -R /github/workspace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs' # Asegúrate de que esta sea la carpeta donde pkgdown genera el sitio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
