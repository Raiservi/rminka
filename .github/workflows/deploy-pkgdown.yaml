## Archivo: .github/workflows/deploy-pkgdown.yaml

on:
  push:
    branches:
      - master

name: Deploy pkgdown site

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            pkgdown
          extra-packages: |
            remotes
            tidytemplate   # <-- CORRECCIÓN APLICADA AQUÍ

      - name: Install dependencies from DESCRIPTION
        run: |
          R -e 'remotes::install_deps(dependencies = TRUE)'

      - name: Build pkgdown site
        run: |
          R -e 'pkgdown::build_site()'

      - name: Simplified listing for debugging
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of current directory:"
          ls -F
          echo "Checking for 'docs' directory:"
          if [ -d "docs" ]; then
            echo "Directory 'docs' found. Contents:"
            ls -F docs
          else
            echo "Directory 'docs' NOT found."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
