    # Workflow para construir y desplegar un sitio de pkgdown
    # Este es el workflow moderno, compatible con la opción "GitHub Actions" en Settings > Pages.

    on:
      push:
        branches: [main, master]
      workflow_dispatch:

    name: pkgdown

    jobs:
      pkgdown:
        runs-on: ubuntu-latest
        # Necesita permisos para escribir en la sección de Pages
        permissions:
          contents: read
          pages: write
          id-token: write
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

        steps:
          - uses: actions/checkout@v4

          - uses: r-lib/actions/setup-r@v2
            with:
              use-public-rspm: true

          - uses: r-lib/actions/setup-r-dependencies@v2
            with:
              extra-packages: any::pkgdown, local::.
              needs: pkgdown

          - name: Build site
            run: pkgdown::build_site(devel = FALSE)
            shell: Rscript {0}

          - name: Upload artifact
            uses: actions/upload-pages-artifact@v3
            with:
              path: ./docs

          - name: Deploy to GitHub pages
            id: deployment
            uses: actions/deploy-pages@v4
